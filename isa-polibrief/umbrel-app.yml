releaseNotes: >-
  1.45.0 — DAILY ANALYST NOTE AND MARKET-EDUCATION BRIEF. Scheduled reports can now run Daily or on
  Weekdays (Settings → Scheduled reports), e.g. both at 15:30. Before a scheduled report the app pulls market
  prices again, so an afternoon note is written on that day's settles and the reports released that morning;
  a report already out today is labelled released, not "coming up". Each daily note opens with what changed
  since the previous one instead of repeating itself, and a call it keeps restating is filed once in the
  track record. New: an analysis budget in dollars (Settings), so the Opus Analyst Note can run daily without
  raising every other ceiling — about $40 a month for both reports; suggested monthly budget $105 with
  analysis $45. Also fixed: saving Settings no longer deletes a multi-day report schedule. No new keys.

  1.44.0 — RED-TEAM SPRINT: SECURITY, RELIABILITY, METHODOLOGY, AND COVERAGE. No new keys required.

  SECURITY — Login protection improved. Failed login attempts are now logged. The threshold before
  lockout drops from 8 to 5 attempts, and lockouts now use exponential backoff (30 seconds doubling
  per additional failure, cap 15 minutes) instead of a flat window. If POLIBRIEF_PASSWORD is still
  set alongside named accounts, the app now warns loudly at startup and flags it on the Setup page.

  RELIABILITY — Two silent bugs fixed. The modelcfg thinking-mode selector was a fragile regex chain
  where any unrecognised model name (from a .env upgrade) would silently HTTP-400 every AI call; it
  is now an explicit table with a loud warning for unknown models. Watchlist focus areas are now
  validated on load: empty terms (silent zero-score), invalid weights, duplicate ids, and unknown
  appliesTo sources are all named in the log.

  CLIMATE SIGNAL — The Indian Ocean Dipole (DMI) index is now tracked alongside ENSO. Several
  major South American drought years occurred during neutral ENSO but positive IOD; the two indices
  together give a materially better prior on SA weather risk. Source: JAMSTEC (keyless).

  ILLINOIS — The Illinois Register adapter is now wired: state-level IL rulemaking is no longer
  invisible. Probe the live index on the Pi before enabling (see the Setup page).

  FUTURES DATA — The Setup page now shows a clear warning when neither CME_SETTLEMENTS nor
  BARCHART_API_KEY is configured, with a pointer to docs/cme-settlements.md.

  STORY REGRESSION — Two regression tests lock in the storylines truncation fix from 1.39.0:
  a max_tokens stop must never update storylines_meta or touch existing threads.

  STATE PACKS — Stub packs for the top 10 soybean-producing states are now shipped (Iowa was the
  only deployed pack before this release): Illinois (pilot), Minnesota, Indiana, Nebraska, Missouri,
  Ohio, South Dakota, North Dakota, Kansas. Each pack lists exactly what the state association needs
  to verify before deploy. No existing Iowa output changes.
