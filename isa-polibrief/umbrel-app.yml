releaseNotes: >-
  The Bean Brief now reads the document, and counts each government action once. Until now three of
  the official sources — including Regulations.gov, where public comments are actually filed — passed
  along only a headline, so relevance decisions, one-line summaries and every AI report were written
  without ever seeing the rule. The Bean Brief now fetches the real Federal Register text behind each
  docket item (abstract, action and agency) before it decides anything, which also means a rule whose
  title is vague but whose text mentions soybeans no longer slips through the filter. The same lookup
  reveals when several feed items are the same notice cross-filed into different dockets: nine
  "August 6" comment deadlines on your calendar turned out to be three notices. Laws, Rules &
  Decisions, the calendar and the deadline list now show one row per action, with "also filed in N
  other dockets" to open the rest — nothing is hidden, and "Did we see this?" still shows every copy.
  Ask the Bean Brief also searches properly now: short terms like 45Z, RFS and RIN were being thrown
  away before the search ran, so questions about them returned unrelated recent items. Finally, AI
  panels say how old they are, and a stale one is no longer quoted to the Analyst as though it were
  current. Update only — no new keys, no settings to change.
