releaseNotes: >-
  TWO NEW DEMAND-SIDE READS ON SOYBEAN OIL — AND A CORRECTED ONE. (1) Monthly U.S. soybean-oil STOCKS and
  PRODUCTION are now tracked, from USDA's Fats & Oils survey — the free stand-in for NOPA's oil numbers,
  which are paywalled. Oil stocks drive the oil share of crush value, so this is the piece the crush picture
  was missing. (2) A renewable-diesel SHARE line for soybean oil: how much of the bean oil going into biofuel
  is going to renewable-diesel plants versus biodiesel plants — about half now, and climbing. That is the 45Z
  demand story in one number.
  FIX — the soybean-oil-to-biofuel demand figure was overstated and is now corrected. The app had been
  double-counting renewable diesel in the soybean, corn and canola oil biofuel-feedstock numbers (it added
  EIA's combined total to the renewable-diesel piece a second time), overstating soybean-oil biofuel demand by
  about half. If the feedstock chart looked high, that is why.
  Update only — no new keys (the EIA and NASS keys already power existing feeds). The new series populate on
  the next market refresh; no change to how briefs are made or what they cost.
  ---
  PREVIOUS RELEASE (1.35.0) — THE BRAZIL SOYBEAN-EXPORT FEED NOW TELLS YOU WHEN IT'S DOWN, INSTEAD OF SHOWING OLD NUMBERS AS IF THEY WERE
  CURRENT. If the SECEX/ComexStat source can't be reached, the app now flags that market layer as unavailable
  for the run, rather than quietly leaving the last-known Brazil export and China-share figures looking like
  today's — the kind of silent staleness that could mislead a read.
  ALSO — small hardening under the hood: the Iowa cash-basis district breakout is now pinned to the confirmed
  AMS data field (no change to what you see; it just can't silently pick the wrong column if AMS reshuffles its
  report), and the data-source discovery tools were refined for the next round of feeds (soybean-oil stocks,
  biofuel feedstock demand, and daily RIN prices).
  Update only — no new keys, no new data series, and no change to how briefs are made or what they cost.
  ---
  PREVIOUS RELEASE (1.34.0) — THE APP NOW ASSEMBLES THE WHOLE U.S. SOYBEAN BALANCE SHEET INTO ONE CARRYOUT NUMBER — AND KEEPS ITS OWN
  FORECAST THAT GETS GRADED. Supply, crush, exports and stocks used to be separate figures the app re-derived
  on the fly; it now builds the full supply-and-demand picture once, so a market read can end in a checkable
  carryout instead of hand-waving. It also makes its own nowcast of ending stocks by layering the observed
  crush and export pace onto USDA's forecast, and that nowcast is scored automatically the moment the next
  WASDE lands — so the app starts keeping its own forecast track record instead of only quoting someone else's.
  ALSO — IOWA CASH BASIS IS NOW BROKEN OUT BY CROP-REPORTING DISTRICT, not just a single statewide average. The
  spread between the six Iowa districts is the real story most weeks (a plant bidding up in the northwest while
  the south sits flat), and it used to be averaged away; it now shows as one compact cross-section line.
  ALSO — NEW COMPETITOR AND WEATHER READS THAT LEAD THE MARKET. Brazil's monthly soybean exports and how much of
  that is going to China (the "China bought Brazil, not us" read); the El Niño / La Niña (ENSO) index, the
  cheapest early tell on South American weather risk; and Mississippi River stage at the barge chokepoints,
  which leads Gulf barge-freight cost by weeks and drove the 2022–2023 export-basis squeezes. Actual monthly
  U.S. export flows (Census) are wired in too, ready to switch on with a free key.
  ALSO — THE CRUSH-CAPACITY TABLE NOW WARNS LOUDLY IF IT GOES STALE, AND HAS BEEN REFRESHED TO THE AUGUST
  CONSULTANT NUMBERS. That table (how much the plants can physically crush) is hand-maintained; if it silently
  went out of date it would make plants look like they were running harder than they are. The app now flags a
  stale table instead of trusting it, and the table is current as of the August 15, 2026 workbook — 8.577
  million bushels/day across 69 plants.
  Update only — no new keys required. The new competitor/weather feeds are keyless and populate on the next
  market refresh; a couple of optional sources (the CME forward curve, U.S. Census trade) stay off until you
  set their key or flag. No change to how briefs are made or what they cost.
  ---
  PREVIOUS RELEASE (1.33.0) — THE MARKET DATA IS NOW LABELED WITH HOW FRESH IT IS, AND ONLY THE NUMBERS ACTUALLY MOVING GET THE
  SPOTLIGHT. Every market figure the app reasons from now shows how many days old it is and, where a USDA
  or CFTC report is due, when the next one lands — so a three-month-old price can no longer read as if it
  were today's, and a feed that has quietly stopped is flagged as stale instead of looking like a calm
  market. At the same time the market section stops burying the signal: series that are moving, at a
  multi-year extreme, or tied to an active trigger are shown in full, while the quiet ones collapse to a
  single line. Nothing is dropped — every number is still there to cite — the routine ones just take less
  room, so the important ones stop getting skimmed past.
  ALSO — REVISED NUMBERS NO LONGER ERASE THE ORIGINAL. When USDA or others revise an already-published
  figure, the app used to overwrite the number it first saw. It now keeps the first print alongside the
  latest, which does two things: it begins recording which way each series gets revised (itself a signal),
  and it fixes a subtle flaw in the "what leads the price" scan, which had been pairing today's revised
  number with a past price move — a number nobody actually had at the time. The scan now uses only what
  was known then.
  ALSO — GROUNDWORK FOR THE FUTURES FORWARD CURVE (carry, store-vs-deliver, calendar spreads) is in place
  but switched OFF. The app can now read CME's full settlement curve and open interest, and this release
  confirmed the Pi can actually reach CME (a cloud server cannot). It ships turned off; there is a short
  guide (cme-settlements) for switching it on when you are ready — it is what will finally let the
  store-vs-deliver card use a real carry spread.
  Update only — no new keys, no settings to change, and no change to how briefs are made or what they cost.
  ---
  PREVIOUS RELEASE (1.32.0) — YOU CAN NOW LET TEAMMATES AND DIRECTORS READ THE BEAN BRIEF IN A NORMAL BROWSER — no Tailscale on
  their laptop, no logging into your Pi. Two things make that safe. First, the site now has a real
  sign-in page with named accounts: each person gets their own username and password, there is a
  Sign out button, and passwords are scrambled before they are stored — never kept in plain text.
  Second, nothing changes until you decide to switch it on. With no accounts the app behaves exactly
  as it does today (open on your Tailscale network); it starts requiring a login the moment you add
  the first account. So you create the logins first, then hand out the link. Accounts are added and
  removed with a one-line command, and there is a short guide in the app's docs (remote-access) for
  that and for publishing a public web link with Tailscale Funnel. Your Outlook calendar
  subscription and the RSS feed keep working — they use a private token link shown on the Settings
  page, because a calendar app cannot fill in a login box. Update only — no new keys, nothing to
  change, and no change at all to how briefs are made or what they cost.
  ---
  PREVIOUS RELEASE (1.31.0) — THE ANALYST NOTE NOW HAS TO SHOW ITS WORK, AND IS ARGUED WITH BEFORE YOU READ IT. Until now the
  Analyst Note made claims and nothing checked whether it could point at anything. Each claim it
  makes is now written down as a numbered piece of evidence — a specific stored item, a specific
  market series, a specific signal — and the app checks every one of those references against what
  is actually in the database. References the AI invents are deleted before you see the note, and a
  claim left with no surviving evidence is automatically marked down to low confidence and flagged,
  rather than being presented as confident. It is not deleted, because a good read with sloppy
  citations is still worth reading; it just cannot pretend to be better supported than it is.
  A second pass then argues against the note. It checks six specific things, and each one is a
  mistake this app has actually made in the past: is it counting the same government action twice
  because it was filed in several places, is the number being used to settle a prediction actually
  measuring the thing predicted or just something related to it, is a "record for the month" claim
  resting on far too few years of history, could an ordinary seasonal pattern explain the whole
  thing, does the evidence even come before the effect it is meant to explain, and are two of the
  note's claims secretly the same claim. Anything it flags is shown to you inline and again in a new
  "Where this read is weak" section. A claim it rejects outright is struck through with the reason
  given, not silently removed — so a bad read cannot quietly come back next week looking new.
  Crucially, that reviewer can only ever LOWER confidence, never raise it. That is enforced by the
  app rather than trusted to the AI, because a reviewer that could talk itself up would just be an
  amplifier, and you would never notice: a more confident note reads better.
  All of this is recorded, so in a few weeks you will be able to see whether the reviewer is
  actually earning its keep — whether claims it marked down really do come true less often than the
  ones it approved. If it turns out to approve nearly everything, the audit report will now say so
  and tell you to switch it off. It is deliberately measurable rather than taken on faith.
  ALSO — THE DAILY BRIEF NOW USES THE EVIDENCE RECORDS IT WAS ALREADY PAYING FOR. Last release added
  verified records of source documents, and the Ask box and Analyst Note started using them, but the
  twice-daily brief — the thing you actually read — was still working from raw text. It now prefers
  the verified record, and the "Evidence" section quotes wording that has been checked word-for-word
  against the source instead of being retyped by the AI. Those records are also now made for
  worth-knowing items, not only the highest-priority ones, so more of the brief rests on checked
  source text.
  ALSO — the Analyst Note gets substantially more room to think. Its budget had been set to keep
  requests simple rather than to fit the analysis, which meant the deepest piece of work in the app
  was the most cramped. And if the Ask box ever runs out of room mid-answer it now says so, instead
  of stopping mid-sentence in a way that looked exactly like a complete answer.
  ⚠️ RUNNING COSTS GO UP in this release, on purpose. The note thinks harder, a stronger model does
  the reasoning behind each claim, the reviewer is a real second opinion rather than a cheap one,
  and evidence records now cover more items. Expect roughly $30–40 a month depending on how often
  you run the Analyst Note, against about $22 before. Run "audit" after a week for the real figure.
  Update only — no new keys, no settings to change.
  ---
  PREVIOUS RELEASE (1.30.0) — STORYLINES NOW SHOW WHAT CHANGED, NOT THE WHOLE THREAD AGAIN. The Storylines panel on the News tab
  was rewriting each thread from scratch every run, so you had to re-read a summary you had already
  read to spot the one new sentence in it. Worse, it was doing that from only the last three weeks of
  items — so a dated event that fell outside that window disappeared from the thread's timeline for
  good, even though it was that thread's own history. Each thread now keeps its history and leads with
  "What's new" — the part you have not seen — plus a status (moved, stalled, resolved, no change), what
  is still unresolved, and the next event expected to move it. Threads that reach a decision are no
  longer deleted a month later just because they went quiet.
  ALSO — EVIDENCE PACKETS. For the highest-priority items, The Bean Brief now reads the source document
  once and files a structured record of it: what happened, the specific claims with the exact sentence
  each one rests on, the dates and deadlines, the figures, and — importantly — what the document does
  NOT say. Everything downstream (the Ask box, the Analyst Note, the memos) then works from that record
  instead of re-reading the same document, and can quote it with confidence because every quote is
  checked word-for-word against the source before it is stored.
  The honesty of that record is enforced by the app, not left to the AI. If a story is only a headline
  and a teaser — which is most of the news feed, because Farm Progress blocks automated reading — no AI
  call is made at all and the record says plainly that the substance was never retrieved. If the AI
  claims more confidence than the amount of text supports, the app overrides it. If a quote is not
  actually in the source, it is dropped and the record is downgraded. A confident-sounding summary of a
  document nobody read is worse than no summary, so it cannot happen quietly.
  This costs about a dollar a month, paid for by no longer regenerating the storylines twice a day when
  once is enough.
  Update only — no new keys, no settings to change.
  ---
  PREVIOUS RELEASE (1.29.0) — THE DAILY BRIEF IS REBUILT. For the last three updates The Bean Brief got much better at reading
  documents properly — grading how relevant each one is, fetching the actual text of federal rules,
  recognising when one government action has been filed in four different places. None of that was
  reaching the brief itself. The twice-daily email was still being written from headlines and a
  one-sentence note about each headline, and it was ordering items by how many of your watchlist words
  they happened to contain. That is why a press release about a board appointment could outrank a
  Supreme Court ruling.
  The brief now gets the real document text and the relevance grade, and it leads with the most
  consequential item rather than the wordiest one. Its shape has changed to match how you actually use
  it: What changed, then Needs attention (only things with something to do inside two weeks, with the
  date), then Could matter later, Deadlines, the Evidence behind each development, and What to watch
  next. Three to five developments by default — everything else is still on the Laws, Rules & Decisions
  page, where it always was. If the substance of an item could not be retrieved, the brief now says so
  instead of writing around it, and where one action was filed in several dockets it says how many
  rather than listing it as several separate signals.
  ALSO — MARKET CHANGE ALERTS NOW ACTUALLY SEND. The "what changed" feed has been quietly detecting
  material market moves all along, but the email digest could never go out: the setting it checked for
  did not exist, and nothing in the app could switch it on. There is now a tick-box under Logs &
  Settings → Market change alerts. Related: if an alert email ever fails to send, the alert is kept and
  retried on the next check rather than being lost, which is what used to happen.
  ALSO — your thumbs-up and thumbs-down now carry more weight. Those corrections are the only way you
  can teach the relevance filter, and the app was ranking them by when the ITEM was collected rather
  than when you made the correction — so a correction on an older item could be crowded out and never
  used. It now uses the moment you clicked.
  Running costs go DOWN slightly in this release: repeated parts of each request to Claude are now
  cached instead of re-sent, which mostly benefits the Analyst Note and the Ask box.
  Update only — no new keys, no settings to change.
  ---
  PREVIOUS RELEASE (1.28.0) — INSTALL THIS INSTEAD OF 1.27.0. Version 1.27.0 had a fault that would have stopped the
  twice-daily policy brief from running at all: every run would have failed part-way through the
  relevance step, so no brief would have been written, and one item per run would have been quietly
  marked as already-handled without ever being read. It was found and fixed before 1.27.0 was ever
  installed, and the relevance step now has its own tests so this cannot come back unnoticed. If you
  are on 1.26.0 or earlier, updating straight to 1.28.0 gets you everything 1.27.0 was meant to
  deliver, working.
  ALSO IN THIS RELEASE — the News tab. News is more than half of everything The Bean Brief collects,
  and it was being stored as a headline plus the first line or two of the story, cut off mid-sentence
  by the publisher's feed. Everything downstream — the search box, the daily digest, the Analyst Note
  — could only ever see that fragment, so a question like "how many soybean acres were planted?" would
  find the right article and still not be able to answer it. The Bean Brief now saves the full article
  text when it first sees a story, so the answer is actually there. It was already fetching those
  articles once a day and throwing them away, so this costs no extra time and no AI spend. Older
  stories fill themselves in as the digest reads them.
  The News list also shows WHO published each item — "Farm Progress", "farmdoc daily", "Feedstuffs" —
  where every row previously read "Entity RSS/Atom feeds". Telling a wire report from a trade group's
  press release is a judgement you need to make at a glance, and the publisher was already recorded;
  it just was not being displayed.
  NEWS IS NOW RANKED, and the mail still arrives in time order. Until now nothing in the News tab was
  graded, so a Supreme Court ruling on pesticide labelling sat at exactly the same weight as a story about
  a 1952 tractor coming home. Every news item is now graded must-read, worth-knowing, or background, and a
  new "⚡ Worth your attention" panel at the top of the News tab lists the must-reads from the last 48
  hours with the publisher and a one-line why-it-matters. The mail below it is untouched and still runs
  newest-first, because with breaking news the order it arrived in is itself information. Nothing is
  hidden and nothing is reordered — the ranking only adds a panel.
  The must-read bar is set deliberately high: a development that could move soybean demand, price, cost,
  or policy. Court rulings, trade actions, tariffs, 45Z and RFS decisions, the big USDA reports, crush or
  renewable-diesel capacity changes, China and Brazil shifts. Board appointments, awards, trade shows,
  equipment tips and human-interest stories are graded background however many times they mention
  biofuels — that was a real failure case, not a hypothetical one. That same bar is what a future
  higher-frequency check would use to decide whether something is worth notifying you about, so reading
  this panel for a couple of weeks is the way to tell whether the threshold is set where you want it.
  Ranking is a judgement call made by the AI, not a keyword count, because keyword counting scored a
  press release announcing a new board director HIGHER than the Supreme Court ruling.
  One honest limitation: Farm Progress blocks automated reading of its articles, and it is the source
  of most of the news feed. Those items keep their headline and feed summary exactly as before, and the
  run log now names any publisher it could not read rather than staying silent about it.
  Update only — no new keys, no settings to change.
