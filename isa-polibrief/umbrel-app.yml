releaseNotes: >-
  Congressional hearings, a homepage calendar, and a reworked rules feed. The Bean Brief now tracks
  committee hearings and markups from Congress — filtered to the committees that matter to Iowa
  soybeans (House & Senate Ag, Ag-Appropriations, Ways & Means, Finance, EPW, and more), with the
  Iowa delegation flagged. A new Calendar on the home page shows every date ahead in one month view:
  USDA reports, public-comment deadlines, hearings, and political/policy milestones (elections, the
  Sept 30 farm bill deadline, the Dec 4 funding deadline). And Laws, Rules & Decisions was overhauled:
  group the feed by state vs. federal, topic, or source; sort by comment deadline; see an at-a-glance
  "open / closing soon / closed" status on every rule; and rules automatically retire from the active
  view once their comment period closes (still there under "Closed"). Also new: a VegScape satellite
  crop-vegetation signal (0–100 VCI) for Iowa and the belt, a leading read on crop vigor ahead of the
  USDA condition rating. After Update, add the new congress_hearings and vegscape sources to your
  watchlist; the first market-refresh backfills ~12 weeks of VegScape tiles (~180 MB, one time).
