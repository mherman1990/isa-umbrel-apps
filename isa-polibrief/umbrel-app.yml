releaseNotes: >-
  Two reliability fixes from a code review. First, no more silently dropped items: the app used to mark a
  source "read up to here" the instant it fetched, before those items were saved — so an interrupted run
  (a bad API key, a rate limit, a crash) could lose them for good. It now advances that marker only after
  everything is safely stored. Second, crash-safe settings: saving your watchlist now writes to a
  temporary file and swaps it in, so an interruption can't corrupt the config and stop the app from
  starting, and impossible schedule times like 25:00 are rejected instead of silently never running.
  Just Update — no new keys.
