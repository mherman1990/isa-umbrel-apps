# Builds the polibrief Docker image for the Raspberry Pi (ARM64) and publishes it to GitHub's
# registry — so updating the Umbrel app never requires building on the Pi again.
#
# Source code AND the Umbrel store manifest now live in this ONE repo (isa-umbrel-apps): the app
# code is at the root (src/, docker/, package.json…) and the store files are umbrel-app-store.yml +
# isa-polibrief/. GITHUB_TOKEN is automatic; no secrets to configure.
#
# TO SHIP A NEW VERSION (two-phase, so the store never advertises an image that isn't built yet):
#   1. Edit code + bump package.json + CHANGELOG.md, and prepend the plain-language note to
#      isa-polibrief/umbrel-app.yml (releaseNotes). Do NOT bump umbrel-app.yml `version` or
#      isa-polibrief/docker-compose.yml (image tag) — auto-release.yml's `advertise` job does that AFTER
#      the image is built and pushed.
#   2. Merge to main. auto-release.yml creates the vX.Y.Z tag, CALLS this workflow to build+publish, then
#      commits the umbrel-app.yml version + compose image-tag bump.
#   3. Umbrel → the app tile shows an Update button only once step 2 finishes (image already on GHCR), so
#      updating can no longer hang on a missing image. No need to time it — the tile appears when it's safe.
#
# The manual path still works unchanged: `git tag vX.Y.Z && git push origin vX.Y.Z` (or the Releases
# UI) triggers the push:tags path below directly. auto-release.yml then no-ops (the tag already exists).
#
# The image is published as: ghcr.io/<owner>/polibrief:<version> (name is owner-based, not repo-based,
# so it stays ghcr.io/mherman1990/polibrief even though this repo is isa-umbrel-apps).
# First publish note: check the package's visibility is Public (github.com → Packages → polibrief).

name: Build and publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # also allows manual runs from the Actions tab
  workflow_call: # invoked by auto-release.yml once it has created the tag for a version bump on main
    inputs:
      version:
        description: "X.Y.Z to tag the image with. Omit to derive it from the git tag name (v1.2.3 -> 1.2.3)."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # workflow_call passes the version explicitly; a tag push derives it from the ref name.
          if [ -n "$INPUT_VERSION" ]; then
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/polibrief:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/polibrief:latest
