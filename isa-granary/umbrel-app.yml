defaultPassword: ""
releaseNotes: >-
  Adds append-only ledger corrections and removal, atomic CSV import/export,
  transfer and reconciliation screens, deterministic cash-flow and liquidity
  planning, seeded goal scenarios, and a protection-readiness checklist.
  Existing local credentials and ledger data remain in the persistent data
  directory. Synthetic preview only; do not enter real household data yet.
