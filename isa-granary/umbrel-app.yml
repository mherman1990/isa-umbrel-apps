manifestVersion: 1
id: isa-granary
category: finance
name: Granary
version: "0.6.0"
tagline: Private household planning, without financial execution
icon: https://raw.githubusercontent.com/mherman1990/isa-umbrel-apps/main/isa-granary/icon.svg
description: >-
  Granary is a private, local-first household planning workspace for one
  consenting household. It includes a traceable ledger, persistent planning
  snapshots and goals, reproducible scenarios, versioned reauthenticated
  policies, deeper deterministic planning, protection-review packets, and local
  operational health.


  It can read real household records by manual entry, CSV, or an owner-configured
  read-only brokerage connector. All three stay disabled until the owner
  completes a local live-readiness attestation held outside the app.


  Granary is decision support only. It cannot trade, transfer money, place an
  order, pay bills, file taxes, sign documents, or connect to Black Gold. No
  household data or credentials are built into the image.
developer: Matt Herman
