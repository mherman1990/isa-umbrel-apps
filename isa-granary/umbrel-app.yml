releaseNotes: >-
  Adds gated real-data intake and a Schwab read-only connector. Both fail closed
  and stay disabled until the owner completes a local live-readiness attestation;
  the app still cannot trade, transfer money, place an order, or contact a model
  provider. Records are encrypted before storage and each batch needs an explicit
  reauthenticated commit. Also unifies the version across the package, server and
  manifest, which previously disagreed.


  Existing credentials and ledger data remain in the persistent data directory.
