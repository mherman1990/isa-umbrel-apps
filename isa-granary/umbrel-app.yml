defaultPassword: ""
releaseNotes: >-
  Adds a unified Today workspace, immutable planning history, versioned goals,
  expiring password-reauthenticated policy approvals, deterministic fees,
  stated tax, inflation, debt-interest and drawdown planning, saved protection
  reviews and printable packets, plus version/health and recovery hardening.
  Existing credentials and synthetic ledger data remain in the persistent data
  directory. Synthetic preview only; do not enter real household data yet.
