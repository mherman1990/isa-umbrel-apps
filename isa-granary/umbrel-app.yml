releaseNotes: >-
  Makes the live-readiness attestation supplyable on the device. 0.6.0 looked for it
  inside the read-only image, at a path that cannot exist there, so real intake was
  unreachable on the Pi rather than merely gated. Both inputs now live on the
  persistent data volume.


  The field-encryption key is named by path rather than by value, so the key that
  decrypts household records never appears in this public repository or in
  `docker inspect` output. Both files are read per request: deleting the attestation
  revokes intake, deleting the key revokes decryption, and neither needs a restart.


  Also fixes an ordering bug in the ledger's correction history, where versions
  recorded in the same millisecond could report a superseded entry as current.


  Intake still ships disabled and stays closed until the owner supplies both files.
  Nothing here enables trading, transfers, orders, or contact with a model provider.
  Existing credentials and ledger data are untouched, and no migration runs.
submitter: Matt
