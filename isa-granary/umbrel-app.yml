manifestVersion: 1
id: isa-granary
category: finance
name: Granary
version: "0.1.2"
tagline: Private household planning, without financial execution
icon: https://raw.githubusercontent.com/mherman1990/isa-umbrel-apps/main/isa-granary/icon.svg
description: >-
  Granary is a private, local-first household planning workspace for one
  consenting household. The current preview provides first-run local
  authentication and a synthetic-only manual ledger with exact money,
  provenance, transfers, and reconciliation foundations.


  Granary is decision support only. It cannot trade, transfer money, pay bills,
  file taxes, sign documents, contact financial providers, or connect to Black
  Gold. Open the app after installation to create the local password; no
  household data or credentials are built into the image.
developer: Matt Herman
website: https://github.com/mherman1990/isa-umbrel-apps
dependencies: []
repo: https://github.com/mherman1990/Granary
support: https://github.com/mherman1990/isa-umbrel-apps/issues
port: 3000
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixes successful sign-in returning immediately to the password screen when
  Granary is opened over Umbrel's plain HTTP app port. Session cookies remain
  HttpOnly and SameSite=Strict; only the HTTPS-only Secure attribute is disabled
  for this trusted local/Tailscale deployment. Also includes the 0.1.1 data
  directory ownership fix. Synthetic preview only; do not enter real household
  data yet.
submitter: Matt
submission: https://github.com/mherman1990/isa-umbrel-apps
