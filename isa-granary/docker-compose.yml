services:
  app_proxy:
    environment:
      APP_HOST: isa-granary_web_1
      APP_PORT: 3000

  data_permissions:
    image: ghcr.io/mherman1990/granary@sha256:aefdd5563ef2a46453dce338cfbc8e69f601d116361a03f7adc6891eb6c18086
    user: "0:0"
    # Non-recursive, deliberately. This container drops every capability except CHOWN, so it holds no
    # DAC_OVERRIDE and cannot read or traverse a directory it does not own. `scripts/backup.ts`
    # creates /data/backups as 0700 owned by uid 1000, so a recursive chown died on the first backup
    # directory it met, exited 1, and left `web` stuck in Created forever through the
    # service_completed_successfully dependency below — the app hung at 1% for anyone who took a
    # backup and then updated.
    #
    # Only the volume root can arrive root-owned, and only on first install; everything beneath it is
    # written by the app as uid 1000 already. Chowning the root alone is therefore sufficient, and it
    # keeps both the 0700 backup directory and the dropped capability rather than trading one for the
    # other. Adding DAC_OVERRIDE would have fixed the symptom by giving this container the ability to
    # read every file in the volume, which is the opposite of what it is for.
    command: ["chown", "1000:1000", "/data"]
    restart: "no"
    read_only: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/mherman1990/granary@sha256:aefdd5563ef2a46453dce338cfbc8e69f601d116361a03f7adc6891eb6c18086
    depends_on:
      data_permissions:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    init: true
    read_only: true
    environment:
      GRANARY_HOST: "0.0.0.0"
      GRANARY_PORT: "3000"
      GRANARY_DATA_DIR: "/data"
      GRANARY_ALLOW_LAN: "true"
      GRANARY_SECURE_COOKIES: "false"
      # umbrel.local serves apps over plain HTTP, so browsers discard a Secure
      # session cookie after login. Since 0.5.1 Granary requires this explicit
      # acknowledgement before it will serve non-loopback HTTP sessions, and
      # refuses to start without it. Limited to Umbrel's private app route.
      GRANARY_ALLOW_INSECURE_HTTP: "true"
      # Real-data intake is owner-supplied and owner-revocable, so both inputs live on the
      # persistent volume rather than in this file. The container is read_only, so /data is the
      # only writable, persistent path available; neither file exists by default and Granary
      # fails closed without them.
      #
      # The key is a path, never a value. An environment variable would put the key that decrypts
      # household financial records into this public repository and into `docker inspect`.
      GRANARY_LIVE_READINESS_FILE: "/data/live-readiness.local.json"
      GRANARY_CONFIDENTIAL_FIELD_KEY_FILE: "/data/field-key"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 384m
    cpus: 1.0
