services:
  app_proxy:
    environment:
      APP_HOST: isa-granary_web_1
      APP_PORT: 3000

  data_permissions:
    image: ghcr.io/mherman1990/granary@sha256:88cd8622f3383478bb0398759d7a92ed765cff7cf3bac31b704f125a239010fa
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    read_only: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/mherman1990/granary@sha256:88cd8622f3383478bb0398759d7a92ed765cff7cf3bac31b704f125a239010fa
    depends_on:
      data_permissions:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    init: true
    read_only: true
    environment:
      GRANARY_HOST: "0.0.0.0"
      GRANARY_PORT: "3000"
      GRANARY_DATA_DIR: "/data"
      GRANARY_ALLOW_LAN: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 384m
    cpus: 1.0
